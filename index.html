<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FATISCO · Email Automation</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f0ede8;
      --surface: #ffffff;
      --surface2: #f7f5f2;
      --border: #e2ddd8;
      --text: #1a1714;
      --text2: #6b6560;
      --accent: #d4470c;
      --accent2: #f5a623;
      --green: #1a7a4a;
      --green-bg: #e8f7ef;
      --green-border: #a8dfc0;
      --red: #c0392b;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 14px;
      --radius-sm: 8px;
      --font-mono: 'Space Mono', monospace;
      --font: 'DM Sans', sans-serif;
      --transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    body.dark {
      --bg: #0d0c12;
      --surface: #131219;
      --surface2: #0f0e15;
      --border: #232130;
      --text: #ede9e3;
      --text2: #6e6a7a;
      --green-bg: #0a1a10;
      --green-border: #1a3d25;
      --shadow: 0 2px 12px rgba(0,0,0,0.5);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 72px;
      /* No transition on body — instant theme switch, no repaint lag */
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--text);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--bg);
      cursor: pointer;
      letter-spacing: 2px;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo:active { opacity: 0.7; }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-pill {
      background: var(--accent);
      color: white;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      opacity: 0;
      transform: scale(0.8);
      transition: var(--transition);
      pointer-events: none;
    }

    .mode-pill.visible {
      opacity: 1;
      transform: scale(1);
    }

    .theme-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: var(--bg);
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:active { opacity: 0.7; }

    /* ===== VIEWS ===== */
    .view-wrapper {
      position: relative;
      overflow: hidden;
    }

    .view {
      width: 100%;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease;
    }

    .view.hidden-left {
      position: absolute;
      top: 0; left: 0;
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .view.hidden-right {
      position: absolute;
      top: 0; left: 0;
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 9px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent);
      line-height: 1;
    }

    .stat-sub {
      font-size: 9px;
      color: var(--text2);
      margin-top: 3px;
      font-family: var(--font-mono);
    }

    .stat-card.permanent .stat-label::after {
      content: ' 🔒';
    }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title span { font-size: 14px; }

    /* ===== INPUTS ===== */
    textarea, input[type="text"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font);
      background: var(--surface2);
      color: var(--text);
      margin-bottom: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      resize: none;
      outline: none;
    }

    textarea:focus, input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(212,71,12,0.1);
    }

    textarea { resize: vertical; }

    /* ===== FILE UPLOAD ===== */
    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--surface2);
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 10px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .file-label:hover { border-color: var(--accent); color: var(--accent); }
    input[type="file"] { display: none; }

    /* ===== BUTTONS ===== */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: opacity 0.1s ease, transform 0.1s ease;
      white-space: nowrap;
      flex: 1 1 auto;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: 0.75; transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: #b83a09; }
    .btn-warn { background: var(--accent2); color: white; border-color: var(--accent2); }
    .btn-warn:hover { background: #e09510; }
    .btn-danger { background: var(--red); color: white; border-color: var(--red); }
    .btn-danger:hover { background: #a93226; }
    .btn-green { background: var(--green); color: white; border-color: var(--green); }
    .btn-back {
      background: transparent;
      border-color: rgba(255,255,255,0.3);
      color: var(--bg);
      flex: 0 0 auto;
      padding: 6px 14px;
      font-size: 12px;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); }

    .btn-sm { padding: 6px 12px; font-size: 12px; flex: 0 0 auto; }

    .btn.active-cc { background: var(--accent); color: white; border-color: var(--accent); }

    /* ===== FILTERS ===== */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin: 14px 0 10px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 30px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .filter-count {
      background: var(--border);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      min-width: 20px;
      text-align: center;
      display: inline-block;
    }

    .filter-btn.active .filter-count {
      background: rgba(255,255,255,0.22);
      color: var(--bg);
    }

    /* ===== EMAIL LIST ===== */
    .email-scroll {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 380px;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .email-list { padding: 6px; }

    .email-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: border-color 0.12s ease, opacity 0.12s ease;
      animation: slideIn 0.15s ease forwards;
      -webkit-tap-highlight-color: transparent;
    }

    .email-item:active:not(.sent) { opacity: 0.7; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .email-item.sent {
      background: var(--green-bg);
      border-color: var(--green-border);
      opacity: 0.75;
      cursor: not-allowed;
    }

    .email-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .email-item.sent .email-num { background: var(--green); }

    .email-info { flex: 1; min-width: 0; }

    .email-addr {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .email-meta {
      font-size: 11px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.sent { background: var(--green); }
    .status-dot.pending { background: var(--accent2); }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text2);
      font-size: 14px;
    }

    .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }

    /* ===== SCROLL BUTTONS ===== */
    .scroll-btns {
      position: fixed;
      right: 14px;
      bottom: 86px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 150;
    }

    .scroll-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: opacity 0.15s ease;
      opacity: 0;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scroll-btn.visible { opacity: 1; pointer-events: auto; }
    .scroll-btn:active { opacity: 0.7; }

    /* ===== BATCH VIEW ===== */
    #batchView .container { padding-top: 20px; }

    .batch-header-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .batch-header-info h2 {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--bg);
    }

    .batch-header-info p {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-family: var(--font-mono);
    }

    .batch-controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    .batch-controls label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      white-space: nowrap;
    }

    .batch-size-input {
      width: 72px !important;
      text-align: center;
      margin-bottom: 0 !important;
      font-family: var(--font-mono) !important;
      font-weight: 700;
    }

    .batch-summary {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text2);
      margin-left: auto;
    }

    .batch-section-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text2);
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .batch-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .batch-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      animation: slideIn 0.2s ease forwards;
    }

    .batch-card.completed {
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    .batch-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .batch-card-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
    }

    .batch-card-count {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    .batch-progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin: 10px 0;
      overflow: hidden;
    }

    .batch-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .batch-card.completed .batch-progress-fill { background: var(--green); }

    .batch-email-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .batch-chip {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: var(--font-mono);
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .batch-chip.sent-chip {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green);
    }

    .batch-chip.more-chip {
      background: var(--surface2);
      color: var(--text2);
      font-style: italic;
    }

    .completed-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text2);
      z-index: 100;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== CC FIELD ===== */
    .cc-field { display: none; }

    /* ===== VALIDATION WARNING ===== */
    .field-warning {
      border-color: var(--red) !important;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.15) !important;
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="logo" id="logoBtn">
    <div class="logo-dot"></div>
    FATISCO
  </div>
  <div class="header-right">
    <span class="mode-pill" id="modePill">BATCH</span>
    <button class="btn btn-back" id="backBtn" style="display:none;" onclick="switchToNormal()">← Back</button>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<!-- ===== VIEW WRAPPER ===== -->
<div class="view-wrapper" id="viewWrapper">

  <!-- ===== NORMAL VIEW ===== -->
  <div class="view" id="normalView">
    <div class="container">

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total</div>
          <div class="stat-number" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-number" id="statPending">0</div>
        </div>
        <div class="stat-card permanent">
          <div class="stat-label">Sent 24H</div>
          <div class="stat-number" id="statSent24h">0</div>
          <div class="stat-sub" id="stat24hSub">0h today</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Sent Total</div>
          <div class="stat-number" id="statSentTotal">0</div>
        </div>
      </div>

      <!-- Email List Input -->
      <div class="card">
        <div class="card-title"><span>📧</span> Email List</div>
        <input type="file" id="fileInput" accept=".csv,.txt">
        <label class="file-label" for="fileInput">📁 Upload CSV / TXT file</label>
        <textarea id="emailInput" rows="3" placeholder="Paste emails here: email,name,company (one per line)"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="processEmails()">⚡ Generate</button>
          <button class="btn btn-warn" onclick="cleanDuplicates()">🧹 Deduplicate</button>
          <button class="btn" onclick="exportCSV()">📥 Export</button>
          <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
        </div>
      </div>

      <!-- Composer -->
      <div class="card">
        <div class="card-title"><span>✉️</span> Composer</div>
        <input type="text" id="subject" placeholder="Subject — use {name}, {company}" value="Opportunity for {company}">
        <textarea id="body" rows="3" placeholder="Body — use {name}, {company}...">Hi {name}, I noticed {company} is doing great work. I'd love to connect.</textarea>
        <div class="btn-row" style="margin-bottom:8px;">
          <button class="btn btn-sm" id="ccBtn" onclick="toggleCC()">📧 Add CC</button>
        </div>
        <div class="cc-field" id="ccField">
          <input type="email" id="ccEmail" placeholder="cc@example.com">
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterEmails('all', this)">All <span class="filter-count" id="cntAll">0</span></button>
        <button class="filter-btn" onclick="filterEmails('pending', this)">🟡 Pending <span class="filter-count" id="cntPending">0</span></button>
        <button class="filter-btn" onclick="filterEmails('sent', this)">✅ Sent <span class="filter-count" id="cntSent">0</span></button>
      </div>

      <!-- Email scroll list -->
      <div class="email-scroll" id="emailScroll">
        <div class="email-list" id="emailList">
          <div class="empty-state"><div class="empty-icon">📭</div>No emails yet. Add some above!</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== BATCH VIEW ===== -->
  <div class="view hidden-right" id="batchView">
    <div class="container">

      <!-- Batch Controls -->
      <div class="batch-controls">
        <label>Emails per batch:</label>
        <input type="number" class="batch-size-input" id="batchSize" value="10" min="1" max="100">
        <button class="btn btn-primary btn-sm" onclick="prepareBatches()">🔄 Recalculate</button>
        <span class="batch-summary" id="batchSummary">—</span>
      </div>

      <!-- Pending Batches -->
      <div id="pendingBatchSection">
        <div class="batch-section-label">Pending Batches</div>
        <div id="pendingBatchList"></div>
      </div>

      <!-- Completed Batches -->
      <div id="completedBatchSection" style="display:none;">
        <div class="batch-section-label">✅ Completed</div>
        <div id="completedBatchList"></div>
      </div>

    </div>
  </div>

</div>

<!-- Scroll buttons -->
<div class="scroll-btns">
  <button class="scroll-btn" id="scrollUp" onclick="scrollUp()">↑</button>
  <button class="scroll-btn" id="scrollDown" onclick="scrollDown()">↓</button>
</div>

<div class="footer">Built by Fatai Ajani · FATISCO © 2026</div>
<div class="toast" id="toast"></div>

<script>
// =============================================
//  STATE
// =============================================
let emailRecords = [];          // current list
// sentByDate: { "YYYY-MM-DD": { email: true, ... }, ... }
// Grows across days, NEVER user-cleared. Resets visually at midnight automatically.
let sentByDate = {};
let sentTotalCount = 0;         // clearable total
let currentFilter = 'all';
let ccEnabled = false;
let currentBatches = [];
let inBatchMode = false;

// =============================================
//  STORAGE
// =============================================
function save() {
  try {
    ls('fatisco_records', JSON.stringify(emailRecords));
    ls('fatisco_sentByDate', JSON.stringify(sentByDate));
    ls('fatisco_total', sentTotalCount);
    ls('fatisco_subject', id('subject').value);
    ls('fatisco_body', id('body').value);
    ls('fatisco_cc_on', ccEnabled);
    ls('fatisco_cc_email', id('ccEmail').value);
    ls('fatisco_batch_size', id('batchSize').value);
  } catch(e) {}
}

function load() {
  try {
    const r = gl('fatisco_records'); if (r) emailRecords = JSON.parse(r);
    const sd = gl('fatisco_sentByDate'); if (sd) sentByDate = JSON.parse(sd);
    // Migrate old format (sent24hTimestamps) if present
    const old = gl('fatisco_24h');
    if (old && !sd) {
      const oldData = JSON.parse(old);
      const today = localDateKey();
      sentByDate[today] = sentByDate[today] || {};
      for (const email of Object.keys(oldData)) sentByDate[today][email] = true;
    }
    const n = gl('fatisco_total'); if (n !== null) sentTotalCount = parseInt(n, 10) || 0;
    const s = gl('fatisco_subject'); if (s) id('subject').value = s;
    const b = gl('fatisco_body'); if (b) id('body').value = b;
    const cc = gl('fatisco_cc_on'); if (cc === 'true') { ccEnabled = true; applyCC(); }
    const ce = gl('fatisco_cc_email'); if (ce) id('ccEmail').value = ce;
    const bs = gl('fatisco_batch_size'); if (bs) id('batchSize').value = bs;
    const el = gl('fatisco_emailInput'); if (el) id('emailInput').value = el;
    const th = gl('fatisco_theme'); if (th === 'dark') document.body.classList.add('dark');
  } catch(e) {}
}

function ls(k, v) { localStorage.setItem(k, v); }
function gl(k) { return localStorage.getItem(k); }
function id(i) { return document.getElementById(i); }

// =============================================
//  STATS & COUNTS
// =============================================
// Returns "YYYY-MM-DD" for the device's local today
function localDateKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// An email is "sent" if it appears in ANY day's record (controls green dot / pending status)
function isSent(email) {
  return Object.values(sentByDate).some(dayMap => dayMap[email]);
}

// 24H count = only emails sent on TODAY's local date
function count24h() {
  const today = localDateKey();
  return Object.keys(sentByDate[today] || {}).length;
}

function updateStats() {
  const sentCount = emailRecords.filter(r => isSent(r.email)).length;
  const pendingCount = emailRecords.length - sentCount;

  id('statTotal').textContent = emailRecords.length;
  id('statPending').textContent = pendingCount;

  // 24H — derived from timestamps only, NEVER from user action
  id('statSent24h').textContent = count24h();
  const h = new Date().getHours();
  id('stat24hSub').textContent = `${h}h elapsed`;

  // Total — clearable
  id('statSentTotal').textContent = sentTotalCount;

  // Filter counts — always real numbers
  id('cntAll').textContent = emailRecords.length;
  id('cntSent').textContent = sentCount;
  id('cntPending').textContent = pendingCount;
}

// =============================================
//  PROCESS EMAILS
// =============================================
function processEmails() {
  const raw = id('emailInput').value;
  ls('fatisco_emailInput', raw);
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  emailRecords = [];
  for (const line of lines) {
    const parts = line.split(',').map(p => p.trim());
    const email = parts[0];
    if (!email || !email.includes('@') || !email.includes('.')) continue;
    const name = cap(parts[1] || email.split('@')[0]);
    const company = cap(parts[2] || email.split('@')[1]?.split('.')[0] || '');
    emailRecords.push({ email, name, company });
  }
  save();
  renderEmails();
  updateStats();
  showToast(`⚡ Loaded ${emailRecords.length} email${emailRecords.length !== 1 ? 's' : ''}`);
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

// =============================================
//  RENDER EMAIL LIST
// =============================================
function renderEmails() {
  let list = emailRecords;
  if (currentFilter === 'sent') list = emailRecords.filter(r => isSent(r.email));
  if (currentFilter === 'pending') list = emailRecords.filter(r => !isSent(r.email));

  if (!list.length) {
    const msgs = {
      all: { icon: '📭', text: 'No emails yet. Add some above!' },
      sent: { icon: '✅', text: 'No sent emails yet.' },
      pending: { icon: '🟡', text: 'All emails have been sent!' }
    };
    const m = msgs[currentFilter];
    id('emailList').innerHTML = `<div class="empty-state"><div class="empty-icon">${m.icon}</div>${m.text}</div>`;
    updateScrollBtns();
    return;
  }

  id('emailList').innerHTML = list.map((r, i) => {
    const sent = isSent(r.email);
    return `<div class="email-item${sent ? ' sent' : ''}" 
      data-email="${r.email}" data-name="${r.name}" data-company="${r.company}"
      onclick="handleEmailClick(this)">
      <div class="email-num">${i + 1}</div>
      <div class="email-info">
        <div class="email-addr">${r.email}</div>
        <div class="email-meta">${r.name}${r.company ? ' · ' + r.company : ''}</div>
      </div>
      <div class="status-dot ${sent ? 'sent' : 'pending'}"></div>
    </div>`;
  }).join('');

  updateScrollBtns();
  updateStats();
}

// =============================================
//  SEND EMAIL (normal mode)
// =============================================
function handleEmailClick(el) {
  if (el.classList.contains('sent')) { showToast('⚠️ Already sent to this contact'); return; }

  const email = el.dataset.email;
  const name = el.dataset.name;
  const company = el.dataset.company;

  const subjectEl = id('subject');
  const bodyEl = id('body');

  const subjectVal = subjectEl.value.trim();
  const bodyVal = bodyEl.value.trim();
  subjectEl.classList.remove('field-warning');
  bodyEl.classList.remove('field-warning');
  if (!subjectVal && !bodyVal) {
    subjectEl.classList.add('field-warning');
    bodyEl.classList.add('field-warning');
    showToast('⚠️ Add a subject or body before sending');
    return;
  }

  const subject = subjectEl.value.replace(/{name}/g, name).replace(/{company}/g, company);
  const body = bodyEl.value.replace(/{name}/g, name).replace(/{company}/g, company);
  let mailto = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (ccEnabled) {
    const cc = id('ccEmail').value.trim();
    if (cc) mailto += `&cc=${encodeURIComponent(cc)}`;
  }
  window.open(mailto, '_blank');

  markSent(email);
  el.classList.add('sent');
  el.querySelector('.status-dot').className = 'status-dot sent';
  el.querySelector('.email-num').style.background = 'var(--green)';
  updateStats();
  save();
  showToast(`✉️ Email opened for ${name}`);

  // sync batch view if open
  if (inBatchMode) syncBatchView();
}

// =============================================
//  MARK SENT (shared logic)
// =============================================
function markSent(email) {
  const wasAlreadySent = isSent(email);
  const today = localDateKey();
  if (!sentByDate[today]) sentByDate[today] = {};
  sentByDate[today][email] = true;
  if (!wasAlreadySent) sentTotalCount++;
}

// =============================================
//  FILTER
// =============================================
function filterEmails(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderEmails();
}

// =============================================
//  CC TOGGLE
// =============================================
function toggleCC() {
  ccEnabled = !ccEnabled;
  applyCC();
  save();
}

function applyCC() {
  id('ccField').style.display = ccEnabled ? 'block' : 'none';
  id('ccBtn').classList.toggle('active-cc', ccEnabled);
  id('ccBtn').textContent = ccEnabled ? '📧 Remove CC' : '📧 Add CC';
}

// =============================================
//  CLEAN DUPLICATES
// =============================================
function cleanDuplicates() {
  const raw = id('emailInput').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const seen = new Set();
  const unique = [];
  let removed = 0;
  for (const line of lines) {
    const email = line.split(',')[0]?.trim().toLowerCase();
    if (email && !seen.has(email)) { seen.add(email); unique.push(line); }
    else if (email) removed++;
  }
  if (removed) {
    id('emailInput').value = unique.join('\n');
    processEmails();
    showToast(`🧹 Removed ${removed} duplicate${removed !== 1 ? 's' : ''}`);
  } else {
    showToast('✨ No duplicates found');
  }
}

// =============================================
//  EXPORT
// =============================================
function exportCSV() {
  if (!emailRecords.length) { showToast('⚠️ Nothing to export — list is empty'); return; }
  let csv = 'Email,Name,Company,Sent\n';
  emailRecords.forEach(r => {
    csv += `"${r.email}","${r.name}","${r.company}","${isSent(r.email) ? 'Yes' : 'No'}"\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `fatisco_export_${Date.now()}.csv`;
  a.click();
  showToast(`📥 Exported ${emailRecords.length} records`);
}

// =============================================
//  CLEAR
// =============================================
function clearAll() {
  if (!confirm(
    'Clear email list?\n\n' +
    '✅ Email list will be cleared\n' +
    '✅ Sent (Total) resets to 0\n' +
    '🔒 Sent (24H) is NEVER cleared — resets automatically at midnight'
  )) return;

  id('emailInput').value = '';
  emailRecords = [];
  sentTotalCount = 0;
  // sentByDate is intentionally NOT touched — permanent across days
  save();
  renderEmails();
  updateStats();
  showToast('📭 List cleared · 24H history preserved');
}

// =============================================
//  BATCH MODE
// =============================================
function switchToBatch() {
  inBatchMode = true;
  id('normalView').classList.remove('hidden-left');
  id('normalView').classList.add('hidden-left');
  id('batchView').classList.remove('hidden-right');
  id('modePill').classList.add('visible');
  id('backBtn').style.display = 'flex';
  prepareBatches();
  window.scrollTo(0, 0);
}

function switchToNormal() {
  inBatchMode = false;
  id('normalView').classList.remove('hidden-left');
  id('batchView').classList.add('hidden-right');
  id('modePill').classList.remove('visible');
  id('backBtn').style.display = 'none';
  renderEmails();
  updateStats();
}

function prepareBatches() {
  const pending = emailRecords.filter(r => !isSent(r.email));
  const batchSize = Math.max(1, parseInt(id('batchSize').value, 10) || 10);
  currentBatches = [];

  for (let i = 0; i < emailRecords.length; i += batchSize) {
    currentBatches.push(emailRecords.slice(i, i + batchSize));
  }

  const totalSentAcrossAll = emailRecords.filter(r => isSent(r.email)).length;
  id('batchSummary').textContent =
    `${totalSentAcrossAll} sent · ${pending.length} pending · ${currentBatches.length} batch${currentBatches.length !== 1 ? 'es' : ''}`;

  renderBatches();
}

function renderBatches() {
  const pendingCards = [];
  const completedCards = [];

  currentBatches.forEach((batch, idx) => {
    const sentInBatch = batch.filter(r => isSent(r.email));
    const totalInBatch = batch.length;
    const allSent = sentInBatch.length === totalInBatch;
    const pct = totalInBatch > 0 ? Math.round((sentInBatch.length / totalInBatch) * 100) : 0;

    const chipsHtml = batch.slice(0, 4).map(r => {
      const sent = isSent(r.email);
      return `<span class="batch-chip ${sent ? 'sent-chip' : ''}">${r.email}</span>`;
    }).join('') + (batch.length > 4 ? `<span class="batch-chip more-chip">+${batch.length - 4} more</span>` : '');

    const card = `
      <div class="batch-card ${allSent ? 'completed' : ''}" id="batchCard_${idx}">
        <div class="batch-card-header">
          <div>
            <div class="batch-card-title">Batch ${idx + 1}</div>
            <div class="batch-card-count">${sentInBatch.length} / ${totalInBatch} sent</div>
          </div>
          ${allSent
            ? `<div class="completed-badge">✅ Done</div>`
            : `<button class="btn btn-primary btn-sm" onclick="sendBatch(${idx})">✉️ Send Batch</button>`
          }
        </div>
        <div class="batch-progress-bar">
          <div class="batch-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="batch-email-chips">${chipsHtml}</div>
      </div>`;

    if (allSent) completedCards.push(card);
    else pendingCards.push(card);
  });

  id('pendingBatchList').innerHTML = pendingCards.join('') ||
    `<div class="empty-state"><div class="empty-icon">🎉</div>All batches completed!</div>`;

  const compSec = id('completedBatchSection');
  if (completedCards.length > 0) {
    compSec.style.display = 'block';
    id('completedBatchList').innerHTML = completedCards.join('');
  } else {
    compSec.style.display = 'none';
  }

  id('batchSummary').textContent = (() => {
    const pending = emailRecords.filter(r => !isSent(r.email)).length;
    const sent = emailRecords.filter(r => isSent(r.email)).length;
    return `${sent} sent · ${pending} pending · ${currentBatches.length} batch${currentBatches.length !== 1 ? 'es' : ''}`;
  })();
}

function sendBatch(idx) {
  const batch = currentBatches[idx];
  if (!batch) return;

  const pending = batch.filter(r => !isSent(r.email));
  if (!pending.length) { showToast('⚠️ All emails in this batch already sent'); return; }

  const subjectEl = id('subject');
  const bodyEl = id('body');
  if (!subjectEl.value.trim() && !bodyEl.value.trim()) {
    showToast('⚠️ Add a subject or body in normal mode first');
    return;
  }

  const bcc = pending.map(r => r.email).join(',');
  const subject = subjectEl.value.replace(/{name}/g, '[NAME]').replace(/{company}/g, '[COMPANY]');
  const body = bodyEl.value.replace(/{name}/g, '[NAME]').replace(/{company}/g, '[COMPANY]');
  let mailto = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (ccEnabled) {
    const cc = id('ccEmail').value.trim();
    if (cc) mailto += `&cc=${encodeURIComponent(cc)}`;
  }
  window.open(mailto, '_blank');

  const alreadySentCount = batch.filter(r => isSent(r.email)).length;
  pending.forEach(r => markSent(r.email));

  save();
  renderBatches();
  updateStats();

  const newlySent = pending.length;
  const skipped = alreadySentCount;
  let msg = `✉️ Batch ${idx + 1}: ${newlySent} email${newlySent !== 1 ? 's' : ''} sent`;
  if (skipped > 0) msg += ` · ${skipped} skipped (already sent)`;
  showToast(msg);
}

// Sync batch view when normal mode sends an email
function syncBatchView() {
  if (inBatchMode) renderBatches();
}

// =============================================
//  SCROLL
// =============================================
const emailScroll = document.getElementById('emailScroll');

function updateScrollBtns() {
  const st = emailScroll.scrollTop;
  const sh = emailScroll.scrollHeight;
  const ch = emailScroll.clientHeight;
  id('scrollUp').classList.toggle('visible', st > 30);
  id('scrollDown').classList.toggle('visible', sh - st - ch > 30);
}

emailScroll.addEventListener('scroll', updateScrollBtns);
function scrollUp() { emailScroll.scrollTo({ top: 0, behavior: 'smooth' }); }
function scrollDown() { emailScroll.scrollTo({ top: emailScroll.scrollHeight, behavior: 'smooth' }); }

// =============================================
//  THEME
// =============================================
function toggleTheme() {
  document.body.classList.toggle('dark');
  ls('fatisco_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

// =============================================
//  TOAST
// =============================================
let toastTimer;
function showToast(msg) {
  const t = id('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// =============================================
//  FILE UPLOAD (single listener, no double dialog)
// =============================================
id('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    id('emailInput').value = e.target.result;
    processEmails();
    showToast(`📁 Loaded: ${file.name}`);
  };
  reader.readAsText(file);
  this.value = '';
});

// =============================================
//  LOGO TAP → BATCH MODE (secret trigger)
// =============================================
let logoTapCount = 0;
let logoTapTimer;
id('logoBtn').addEventListener('click', () => {
  if (inBatchMode) return; // already in batch
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 600);
  if (logoTapCount >= 2) {
    logoTapCount = 0;
    if (!emailRecords.length) { showToast('⚠️ Add emails first before using Batch Mode'); return; }
    switchToBatch();
  }
});

// =============================================
//  AUTO-SAVE INPUTS
// =============================================
['subject', 'body', 'ccEmail'].forEach(i => {
  id(i)?.addEventListener('input', save);
});
id('emailInput').addEventListener('input', () => {
  ls('fatisco_emailInput', id('emailInput').value);
});
id('batchSize').addEventListener('change', () => {
  save();
  if (inBatchMode) prepareBatches();
});

// =============================================
//  MIDNIGHT AUTO-RESET for 24H display
//  Uses device local clock. At midnight, today's
//  date key changes so count24h() returns 0.
//  sentByDate keeps all past days — never user-cleared.
// =============================================
function scheduleMidnightRefresh() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const msUntil = midnight - now + 500; // half-second buffer past midnight
  setTimeout(() => {
    // New day — count24h() will now read the new date key, which has no entries yet → shows 0
    updateStats();
    renderEmails();
    scheduleMidnightRefresh(); // reschedule for next midnight
  }, msUntil);
}

// Update 24H display every minute in case device clock ticks past midnight while app is open
setInterval(() => {
  id('statSent24h').textContent = count24h();
  const h = new Date().getHours();
  id('stat24hSub').textContent = `${h}h elapsed`;
}, 60000);

// =============================================
//  INIT — one-time data reset for fresh start
//  Uses a version flag so it only runs ONCE,
//  never again on subsequent reloads.
// =============================================
const CURRENT_VERSION = 'v3';
if (localStorage.getItem('fatisco_version') !== CURRENT_VERSION) {
  localStorage.clear();
  localStorage.setItem('fatisco_version', CURRENT_VERSION);
}
load();
renderEmails();
updateStats();
scheduleMidnightRefresh();
</script>
</body>
</html>
