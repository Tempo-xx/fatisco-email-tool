<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FATISCO · Email Automation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #1e293b;
      line-height: 1.4;
      padding-bottom: 70px;
    }

    body.dark {
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: #4f46e5;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      cursor: pointer;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid #e9eef2;
    }

    .dark .stat-card {
      background: #1e293b;
      border-color: #334155;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 800;
      color: #4f46e5;
    }

    .stat-small {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e9eef2;
    }

    .dark .card {
      background: #1e293b;
      border-color: #334155;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .file-upload {
      margin-bottom: 12px;
    }

    .file-input {
      display: none;
    }

    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .dark .file-label {
      background: #1e293b;
      border-color: #475569;
    }

    .file-label:hover {
      border-color: #4f46e5;
    }

    textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d9e6;
      border-radius: 12px;
      font-size: 14px;
      background: white;
      margin-bottom: 12px;
    }

    .dark textarea, .dark input {
      background: #0f172a;
      border-color: #334155;
      color: #e2e8f0;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: white;
      border: 1px solid #d1d9e6;
      flex: 1 1 auto;
    }

    .dark .btn {
      background: #1e293b;
      border-color: #475569;
      color: #e2e8f0;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
      border: none;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin: 16px 0 12px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 30px;
      background: #f1f5f9;
      border: 1px solid #d1d9e6;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .filter-count {
      background: rgba(0,0,0,0.1);
      padding: 2px 6px;
      border-radius: 20px;
      font-size: 10px;
    }

    .email-scroll-container {
      background: white;
      border-radius: 16px;
      border: 1px solid #e9eef2;
      max-height: 400px;
      overflow-y: auto;
    }

    .dark .email-scroll-container {
      background: #1e293b;
      border-color: #334155;
    }

    .email-list {
      padding: 6px;
    }

    .email-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dark .email-item {
      background: #0f172a;
      border-color: #334155;
    }

    .email-item:hover {
      border-color: #4f46e5;
      transform: translateY(-1px);
    }

    .email-item.sent {
      background: #f0fdf4;
      border-color: #bbf7d0;
      opacity: 0.8;
      cursor: not-allowed;
    }

    .dark .email-item.sent {
      background: #064e3b;
      border-color: #047857;
    }

    .email-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .email-item.sent .email-number {
      background: #10b981;
    }

    .email-details {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .email-addr {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .email-name {
      color: #64748b;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 4px;
    }

    .status-dot.sent { background: #22c55e; }
    .status-dot.pending { background: #f59e0b; }

    .batch-panel {
      background: #eef2ff;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      border: 1px solid #cbd5e1;
    }
    .dark .batch-panel {
      background: #1e293b;
      border-color: #475569;
      color: #e2e8f0;
    }
    .batch-panel .batch-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .batch-size-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .batch-size-input {
      width: 80px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      text-align: center;
    }
    .dark .batch-size-input {
      background: #0f172a;
      border-color: #475569;
      color: white;
    }
    .batch-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
    }
    .batch-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #cbd5e1;
    }
    .dark .batch-item {
      border-bottom-color: #334155;
    }
    .batch-email-list {
      font-size: 12px;
      color: #475569;
    }
    .dark .batch-email-list {
      color: #94a3b8;
    }

    .scroll-buttons {
      position: fixed;
      right: 15px;
      bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scroll-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scroll-btn.hidden {
      display: none;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }

    .dark .footer {
      background: #1e293b;
      border-color: #334155;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body class="light">

<div class="header">
  <div class="header-content">
    <div class="logo" id="fatiscoLogo">
      <span class="logo-text">FATISCO</span>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total</div>
      <div class="stat-number" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Valid</div>
      <div class="stat-number" id="statValid">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sent (24h)</div>
      <div class="stat-number" id="statSent24h">0</div>
      <div class="stat-small" id="timeSinceMidnight"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sent (Total)</div>
      <div class="stat-number" id="statSentTotal">0</div>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="card-header"><span>📧</span> Email List</div>
    <div class="file-upload">
      <input type="file" id="fileInput" class="file-input" accept=".csv,.txt">
      <label for="fileInput" class="file-label">📁 Upload CSV/TXT</label>
    </div>
    <textarea id="emailInput" rows="3" placeholder="email,name,company"></textarea>
    <div class="button-group">
      <button class="btn btn-primary" onclick="processEmails()">⚡ Generate</button>
      <button class="btn btn-warning" onclick="cleanDuplicates()">🧹 Clean Duplicates</button>
      <button class="btn" onclick="exportCSV()">📥 Export</button>
      <button class="btn btn-danger" onclick="clearAllEditableData()">🗑️ Clear</button>
    </div>
  </div>

  <!-- Composer Card -->
  <div class="card">
    <div class="card-header"><span>✉️</span> Composer</div>
    <input type="text" id="subject" placeholder="Subject" value="Opportunity for {company}">
    <textarea id="body" rows="2" placeholder="Body...">Hi {name}, I noticed {company} is doing great work. I'd love to connect.</textarea>
    <div style="display: flex; gap: 8px; margin: 8px 0;">
      <button class="btn" id="ccBtn" onclick="toggleCC()" style="padding: 6px 12px;">📧 CC</button>
    </div>
    <div id="ccField" style="display: none;"><input type="email" id="ccEmail" placeholder="cc@example.com"></div>
  </div>

  <!-- Filters -->
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="filterEmails('all')">All <span class="filter-count" id="countAll">0</span></button>
    <button class="filter-btn" onclick="filterEmails('pending')">Pending <span class="filter-count" id="countPending">0</span></button>
    <button class="filter-btn" onclick="filterEmails('sent')">Sent <span class="filter-count" id="countSent">0</span></button>
  </div>

  <!-- Email List -->
  <div class="email-scroll-container" id="emailScrollContainer">
    <div class="email-list" id="emailList"></div>
  </div>

  <!-- Batch Panel (hidden) -->
  <div id="batchPanel" style="display: none;"></div>
</div>

<div class="scroll-buttons">
  <button class="scroll-btn" id="scrollTopBtn" onclick="scrollToTop()">↑</button>
  <button class="scroll-btn" id="scrollBottomBtn" onclick="scrollToBottom()">↓</button>
</div>

<div class="footer">Built by Fatai Ajani · FATISCO © 2026</div>
<div id="toast" class="toast"></div>

<script>
  // ==================== DATA ====================
  let emailRecords = [];              // current email list (cleared by "Clear")
  let sent24hTimestamps = {};         // PERMANENT: email -> timestamp (NEVER cleared by user)
  let sentTotalCount = 0;             // CLEARABLE: total emails sent since last clear

  let currentFilter = 'all';
  let ccEnabled = false;

  // ==================== HELPER FUNCTIONS ====================
  function getTodayMidnight() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  function getHoursSinceMidnight() {
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((now - midnight) / (1000 * 60 * 60));
  }

  // Updates ONLY the "Sent (24h)" display from sent24hTimestamps
  function updateSent24hStats() {
    const now = Date.now();
    const oneDayAgo = now - (24 * 60 * 60 * 1000);
    let sent24h = 0;
    for (let ts of Object.values(sent24hTimestamps)) {
      if (ts > oneDayAgo) sent24h++;
    }
    document.getElementById('statSent24h').textContent = sent24h;
    document.getElementById('timeSinceMidnight').textContent = `${getHoursSinceMidnight()}h today`;
  }

  // Updates "Sent (Total)" from sentTotalCount
  function updateSentTotalStats() {
    document.getElementById('statSentTotal').textContent = sentTotalCount;
  }

  // Total & Valid counts (only from current emailRecords)
  function updateListStats() {
    document.getElementById('statTotal').textContent = emailRecords.length;
    document.getElementById('statValid').textContent = emailRecords.length;
  }

  function updateFilterCounts() {
    const total = emailRecords.length;
    const sent = emailRecords.filter(r => sent24hTimestamps[r.email]).length;
    const pending = total - sent;
    document.getElementById('countAll').textContent = total;
    document.getElementById('countSent').textContent = sent;
    document.getElementById('countPending').textContent = pending;
  }

  // ==================== STORAGE (persistent) ====================
  function loadAllData() {
    try {
      const savedList = localStorage.getItem('fatisco_email_list');
      if (savedList) document.getElementById('emailInput').value = savedList;
      const savedSubject = localStorage.getItem('fatisco_subject');
      if (savedSubject) document.getElementById('subject').value = savedSubject;
      const savedBody = localStorage.getItem('fatisco_body');
      if (savedBody) document.getElementById('body').value = savedBody;
      const savedCC = localStorage.getItem('fatisco_cc_enabled');
      if (savedCC === 'true') {
        ccEnabled = true;
        document.getElementById('ccField').style.display = 'block';
        document.getElementById('ccBtn').style.background = '#4f46e5';
        document.getElementById('ccBtn').style.color = 'white';
      }
      const savedCCEmail = localStorage.getItem('fatisco_cc_email');
      if (savedCCEmail) document.getElementById('ccEmail').value = savedCCEmail;
      const savedTimestamps = localStorage.getItem('fatisco_sent24h');
      if (savedTimestamps) sent24hTimestamps = JSON.parse(savedTimestamps);
      const savedTotal = localStorage.getItem('fatisco_sent_total');
      if (savedTotal) sentTotalCount = parseInt(savedTotal, 10) || 0;
      const savedRecords = localStorage.getItem('fatisco_records');
      if (savedRecords) emailRecords = JSON.parse(savedRecords);
    } catch(e) {}
  }

  function saveAllData() {
    localStorage.setItem('fatisco_email_list', document.getElementById('emailInput').value);
    localStorage.setItem('fatisco_subject', document.getElementById('subject').value);
    localStorage.setItem('fatisco_body', document.getElementById('body').value);
    localStorage.setItem('fatisco_cc_enabled', ccEnabled);
    localStorage.setItem('fatisco_cc_email', document.getElementById('ccEmail').value);
    localStorage.setItem('fatisco_sent24h', JSON.stringify(sent24hTimestamps));
    localStorage.setItem('fatisco_sent_total', sentTotalCount);
    localStorage.setItem('fatisco_records', JSON.stringify(emailRecords));
  }

  // ==================== PROCESS EMAILS ====================
  function processEmails() {
    const raw = document.getElementById('emailInput').value;
    const lines = raw.split('\n').filter(l => l.trim());
    emailRecords = [];
    for (let line of lines) {
      const parts = line.split(',').map(p => p.trim());
      const email = parts[0];
      if (!email || !email.includes('@')) continue;
      const name = parts[1] || email.split('@')[0];
      const company = parts[2] || email.split('@')[1]?.split('.')[0] || '';
      emailRecords.push({
        email,
        name: name.charAt(0).toUpperCase() + name.slice(1),
        company: company.charAt(0).toUpperCase() + company.slice(1)
      });
    }
    saveAllData();
    renderEmails();
    updateListStats();
    updateSent24hStats();
    updateSentTotalStats();
    showToast(`Loaded ${emailRecords.length} emails`);
  }

  function renderEmails() {
    let filtered = emailRecords;
    if (currentFilter === 'sent') filtered = emailRecords.filter(r => sent24hTimestamps[r.email]);
    else if (currentFilter === 'pending') filtered = emailRecords.filter(r => !sent24hTimestamps[r.email]);
    let html = '';
    filtered.forEach((r, idx) => {
      const sent = !!sent24hTimestamps[r.email];
      html += `<div class="email-item ${sent ? 'sent' : ''}" data-email="${r.email}" data-name="${r.name}" data-company="${r.company}">
        <div class="email-number">${idx+1}</div>
        <div class="email-details">
          <span class="email-addr">${r.email}</span>
          <span class="email-name">${r.name}</span>
        </div>
        <div class="status-dot ${sent ? 'sent' : 'pending'}"></div>
      </div>`;
    });
    document.getElementById('emailList').innerHTML = html || '<div style="padding:20px;text-align:center;">No emails</div>';
    document.querySelectorAll('.email-item').forEach(card => card.addEventListener('click', handleEmailClick));
    updateFilterCounts();
  }

  // ==================== SEND EMAIL ====================
  function handleEmailClick(e) {
    const card = e.currentTarget;
    const email = card.dataset.email;
    const name = card.dataset.name;
    const company = card.dataset.company;
    if (sent24hTimestamps[email]) {
      showToast('⚠️ Already sent');
      return;
    }
    const subject = document.getElementById('subject').value.replace(/{name}/g, name).replace(/{company}/g, company);
    const body = document.getElementById('body').value.replace(/{name}/g, name).replace(/{company}/g, company);
    let mailto = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if (ccEnabled) {
      const cc = document.getElementById('ccEmail').value.trim();
      if (cc) mailto += `&cc=${encodeURIComponent(cc)}`;
    }
    window.open(mailto, '_blank');
    
    // Update both counters
    const now = Date.now();
    sent24hTimestamps[email] = now;    // PERMANENT for 24h counter
    sentTotalCount++;                   // CLEARABLE total counter
    
    card.classList.add('sent');
    card.querySelector('.status-dot').classList.remove('pending');
    card.querySelector('.status-dot').classList.add('sent');
    
    updateSent24hStats();
    updateSentTotalStats();
    updateFilterCounts();
    updateListStats();
    saveAllData();
    showToast(`✉️ Sent to ${name}`);
  }

  // ==================== CLEAN DUPLICATES ====================
  function cleanDuplicates() {
    const raw = document.getElementById('emailInput').value;
    const lines = raw.split('\n').filter(l => l.trim());
    const seen = new Set();
    const unique = [];
    let removed = 0;
    for (let line of lines) {
      const email = line.split(',')[0]?.trim().toLowerCase();
      if (email && !seen.has(email)) {
        seen.add(email);
        unique.push(line);
      } else if (email) removed++;
    }
    if (removed) {
      document.getElementById('emailInput').value = unique.join('\n');
      processEmails();
      showToast(`🧹 Removed ${removed} duplicate(s)`);
    } else showToast('✨ No duplicates');
  }

  // ==================== CLEAR (resets email list + records + Sent Total) ====================
  function clearAllEditableData() {
    if (confirm('Clear email list and reset current view?\n\n✅ Email list cleared\n✅ Current records reset\n✅ Sent (Total) reset to 0\n❌ Sent (24h) history stays FOREVER')) {
      document.getElementById('emailInput').value = '';
      emailRecords = [];
      sentTotalCount = 0;        // ← THIS IS THE FIX: reset total counter
      saveAllData();
      renderEmails();
      updateListStats();
      updateSent24hStats();
      updateSentTotalStats();
      showToast('📭 Email list cleared (Sent Total reset, 24h history untouched)');
    }
  }

  // ==================== FILTERS ====================
  function filterEmails(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderEmails();
  }

  // ==================== CC TOGGLE ====================
  function toggleCC() {
    ccEnabled = !ccEnabled;
    document.getElementById('ccField').style.display = ccEnabled ? 'block' : 'none';
    document.getElementById('ccBtn').style.background = ccEnabled ? '#4f46e5' : '';
    document.getElementById('ccBtn').style.color = ccEnabled ? 'white' : '';
    saveAllData();
  }

  // ==================== EXPORT ====================
  function exportCSV() {
    let csv = 'Email,Name,Company,Sent\n';
    emailRecords.forEach(r => csv += `"${r.email}","${r.name}","${r.company}",${sent24hTimestamps[r.email] ? 'Yes' : 'No'}\n`);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fatisco_${Date.now()}.csv`;
    a.click();
    showToast('CSV exported');
  }

  // ==================== BATCH MODE (Hidden trigger on logo) ====================
  let currentBatches = [];
  function prepareBatches() {
    const pending = emailRecords.filter(r => !sent24hTimestamps[r.email]);
    if (!pending.length) {
      document.getElementById('batchList').innerHTML = '<div class="batch-item">No pending emails</div>';
      return;
    }
    const batchSize = parseInt(document.getElementById('batchSizeInput')?.value || '10', 10);
    const size = Math.max(1, batchSize);
    const batches = [];
    for (let i = 0; i < pending.length; i += size) {
      batches.push(pending.slice(i, i + size));
    }
    currentBatches = batches;
    let html = '';
    batches.forEach((batch, idx) => {
      const emailPreview = batch.map(e => e.email).slice(0, 2).join(', ') + (batch.length > 2 ? ` +${batch.length-2} more` : '');
      html += `<div class="batch-item">
        <div><strong>Batch ${idx+1}</strong> (${batch.length} emails)<br><span class="batch-email-list">${emailPreview}</span></div>
        <button class="btn btn-primary" style="padding:4px 12px;" onclick="sendBatch(${idx})">Send</button>
      </div>`;
    });
    document.getElementById('batchList').innerHTML = html;
  }

  function sendBatch(idx) {
    const batch = currentBatches[idx];
    if (!batch) return;
    const bcc = batch.map(r => r.email).join(',');
    const subject = document.getElementById('subject').value.replace(/{name}/g, '[NAME]').replace(/{company}/g, '[COMPANY]');
    const body = document.getElementById('body').value.replace(/{name}/g, '[NAME]').replace(/{company}/g, '[COMPANY]');
    let mailto = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if (ccEnabled) {
      const cc = document.getElementById('ccEmail').value.trim();
      if (cc) mailto += `&cc=${encodeURIComponent(cc)}`;
    }
    window.open(mailto, '_blank');
    const now = Date.now();
    for (let r of batch) {
      if (!sent24hTimestamps[r.email]) {
        sent24hTimestamps[r.email] = now;
        sentTotalCount++;
      }
    }
    saveAllData();
    renderEmails();
    updateSent24hStats();
    updateSentTotalStats();
    updateListStats();
    updateFilterCounts();
    prepareBatches();  // refresh batch list
    showToast(`Batch ${idx+1} sent (${batch.length} emails)`);
  }

  // Toggle batch panel (hidden trigger on logo)
  document.getElementById('fatiscoLogo').addEventListener('click', () => {
    let panel = document.getElementById('batchPanel');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      panel.innerHTML = `<div class="batch-panel">
        <div class="batch-title">📦 BATCH MODE (BCC)</div>
        <div class="batch-size-row">
          <span>Emails per batch:</span>
          <input type="number" id="batchSizeInput" class="batch-size-input" value="10" min="1" max="50" step="1">
          <button class="btn btn-primary" style="padding:6px 12px;" onclick="prepareBatches()">Prepare Batches</button>
        </div>
        <div id="batchList" class="batch-list"></div>
      </div>`;
      if (emailRecords.length) prepareBatches();
    } else {
      panel.style.display = 'none';
      panel.innerHTML = '';
    }
  });

  // ==================== SCROLL & UI ====================
  const scrollContainer = document.getElementById('emailScrollContainer');
  if (scrollContainer) {
    scrollContainer.addEventListener('scroll', () => {
      const st = scrollContainer.scrollTop, sh = scrollContainer.scrollHeight, ch = scrollContainer.clientHeight;
      document.getElementById('scrollTopBtn').classList.toggle('hidden', st < 50);
      document.getElementById('scrollBottomBtn').classList.toggle('hidden', sh - st - ch < 50);
    });
  }
  function scrollToTop() { scrollContainer?.scrollTo({ top: 0, behavior: 'smooth' }); }
  function scrollToBottom() { scrollContainer?.scrollTo({ top: scrollContainer.scrollHeight, behavior: 'smooth' }); }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('fatisco_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // File upload
  document.querySelector('.file-label')?.addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput')?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('emailInput').value = e.target.result;
      processEmails();
      showToast(`Loaded ${file.name}`);
    };
    reader.readAsText(file);
    this.value = '';
  });

  // Auto-save inputs
  document.getElementById('emailInput')?.addEventListener('input', saveAllData);
  document.getElementById('subject')?.addEventListener('input', saveAllData);
  document.getElementById('body')?.addEventListener('input', saveAllData);
  document.getElementById('ccEmail')?.addEventListener('input', saveAllData);

  // Midnight reset check (only for display, sent24hTimestamps are never erased)
  function scheduleMidnightReset() {
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const msToMidnight = midnight - now;
    setTimeout(() => {
      updateSent24hStats();  // This will show 0 for today if no new sends after midnight
      scheduleMidnightReset();
    }, msToMidnight + 1000);
  }

  // ==================== INIT ====================
  loadAllData();
  renderEmails();
  updateListStats();
  updateSent24hStats();
  updateSentTotalStats();
  scheduleMidnightReset();
  if (localStorage.getItem('fatisco_theme') === 'dark') document.body.classList.add('dark');
  setInterval(updateSent24hStats, 60000);
</script>
</body>
</html>
